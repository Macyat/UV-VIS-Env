# 训练端预处理链（与 ai-meta-main 现有行为一致）
#
# 现有实现散落在 5 处：
#   preprocessing.py / utils.py / river_inference.py
#   standard_solution_inference.py / local_regression_scripts/ai*/
# 其中 river_inference.py 的 pca 变体把 SNV 做成「全矩阵全局标准化」，
# 与其他位置的「逐条光谱 SNV」语义不同 —— 本配置把语义钉死为 per_spectrum。
#
# 注意：本链含 wiener 与 wavelet，二者无法编译到 edge 运行时；
# 部署请用 dayu_edge.yaml。
chain:
  - op: wiener
  - op: savgol
    window: 15
    polyorder: 3
  - op: wavelet
    wavelet: sym4
    level: 2
  - op: snv
