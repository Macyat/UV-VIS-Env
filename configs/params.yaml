# 水质参数的计量定义
#
# 来源：ai-meta-main/preprocessing.py::get_configs() 的六个 elif 分支。
# 那里把 ranges / lower_bound / upper_bound / abs_error_bound / mape_bound
# 硬编码在 Python 里，改一次要动代码；此处抽成数据。
#
# ranges:   GB3838 类别分界（I/II/III/IV/V）
# lower_bound: 检出限     upper_bound: 量程上限
# abs_error_bound: 低浓度允许绝对误差   mape_bound: 高浓度允许相对误差

params:
  KMNO:                 # 高锰酸盐指数 CODMn
    ranges: [2, 4, 6, 10, 15]
    lower_bound: 0
    upper_bound: 15
    abs_error_bound: 1
    mape_bound: 0.15
    unit: mg/L

  COD:                  # 化学需氧量
    ranges: [15, 15, 20, 30, 40]
    lower_bound: 4
    upper_bound: 40
    abs_error_bound: 4
    mape_bound: 0.15
    unit: mg/L

  TN:                   # 总氮
    ranges: [0.2, 0.5, 1, 1.5, 2]
    lower_bound: 0
    upper_bound: 15
    abs_error_bound: 0.1
    mape_bound: 0.3
    unit: mg/L

  TP:                   # 总磷
    ranges: [0.02, 0.1, 0.2, 0.3, 0.4]
    lower_bound: 0
    upper_bound: 2
    abs_error_bound: 0.02
    mape_bound: 0.15
    unit: mg/L

  AN:                   # 氨氮
    ranges: [0.15, 0.5, 1, 1.5, 2]
    lower_bound: 0
    upper_bound: 3
    abs_error_bound: 0.2
    mape_bound: 0.15
    unit: mg/L

  TUR:                  # 浊度
    ranges: [30, 50, 1000]
    lower_bound: 0
    upper_bound: 150
    abs_error_bound: 5
    mape_bound: 0.15
    unit: NTU
